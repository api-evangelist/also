aid: also
name: Also
description: 'ALSO (Also, Inc.) is a Palo Alto, California electric micromobility company
  spun out of Rivian in March 2025, building small electric vehicles for moving people
  and goods, both driven and autonomous. Its flagship product is the TM-B, a modular
  Class 3 electric bike with a swappable top frame and the in-house DreamRide software-defined
  drive system, alongside a delivery quad for logistics fleets and the Alpha Wave helmet.
  ALSO reached a $1B valuation in 2026 on a $200M round led by Greenoaks and announced
  an autonomous-delivery partnership with DoorDash. Its public digital surface is a
  Shopify-hosted commerce platform at ridealso.com that exposes an open Storefront
  GraphQL API (35 queries / 41 mutations), the Shopify JSON storefront endpoints, and
  a Universal Commerce Protocol (UCP) MCP endpoint for agent-driven shopping and checkout,
  all advertised in the company''s own published agents.md / llms.txt.'
