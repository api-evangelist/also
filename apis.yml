apis:
- name: ALSO Storefront GraphQL API
  description: >-
    The Shopify Storefront GraphQL API served on ALSO's own domain. Open, unauthenticated introspection
    was confirmed; 35 root queries (products, collections, cart, search, blogs, shop, localization) and
    41 mutations (cart lifecycle, customer accounts, Shop Pay payment request sessions) are live. Dated
    API versions are published via the publicApiVersions query.
  humanURL: https://ridealso.com/agents.md
  baseURL: https://ridealso.com/api/2026-07/graphql.json
  tags:
  - GraphQL
  - E-Commerce
  - Catalog
  - Cart
  - Checkout
  properties:
  - type: GraphQL
    url: graphql/also-storefront-2026-07.graphql
  - type: Documentation
    url: https://shopify.dev/docs/api/storefront
  - type: DataModel
    url: data-model/also-data-model.yml
  - type: ErrorCatalog
    url: errors/also-problem-types.yml
- name: ALSO UCP Commerce MCP API
  description: >-
    ALSO's Universal Commerce Protocol (UCP) endpoint, advertised in its own /.well-known/ucp discovery
    profile and /agents.md. Exposes the dev.ucp.shopping service over MCP transport for agent-driven catalog
    search, cart, checkout, fulfillment, discount and order capabilities, with Google Pay, Shopify card
    and Shop Pay payment handlers. tools/list is gated on a UCP-Agent profile URI.
  humanURL: https://ridealso.com/agents.md
  baseURL: https://ridealso.com/api/ucp/mcp
  tags:
  - MCP
  - Agentic Commerce
  - UCP
  - Checkout
  properties:
