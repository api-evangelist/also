  detail: An unknown collection handle returns HTTP 200 with an empty products array.
    Agents must check emptiness rather than relying on a 404.
  source_operation: openapi/also-storefront-json-openapi.yml#listCollectionProducts
  observed: {url: 'https://ridealso.com/collections/does-not-exist/products.json', http_status: 200}
