  title: UCP discovery failed
  jsonrpc_code: -32001
  code: invalid_profile_url
  detail: 'Unable to fetch agent profile: Missing profile uri. The caller did not send
    meta.ucp-agent.profile / the UCP-Agent header.'
  remediation: Publish a UCP agent profile document and send its URI on every request.
  observed: {url: 'https://ridealso.com/api/ucp/mcp', http_status: 422}
- status: 429
